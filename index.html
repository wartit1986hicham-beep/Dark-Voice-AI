<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Voice AI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }
        h1 {
            color: #c084fc;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            width: 100%;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Dark Voice AI</h1>
    <p>تشغيل المقطع الصوتي بالدارجة المغربية</p>
    
    <button class="btn" onclick="playDarija()">🔊 استماع بصوتك الشخصي</button>
</div>

<script>
    function playDarija() {
        // تشغيل الملف المرفوع مباشرة
        let audio = new Audio('Darija.mp3');
        audio.play().catch(function(error) {
            alert("وقع مشكل فـ تشغيل الصوت، تأكد من تحديث الصفحة!");
        });
    }
</script>

</body>
</html>
