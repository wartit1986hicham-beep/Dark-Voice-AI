<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Voice AI - محول النص إلى صوت</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            background: #2d2d2d;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        select, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        select {
            background: #2d2d2d;
            color: #ffffff;
        }
        button {
            background: #bb86fc;
            color: #121212;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #3700b3;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dark Voice AI</h2>
        <textarea id="textInput" placeholder="اكتب هنا النص اللي بغيتي تحولو لصوت..."></textarea>
        
        <select id="voiceSelect">
            <!-- الأصوات غادي تعمر اوتوماتيكياً -->
        </select>

        <button onclick="speakText()">استماع للصوت</button>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        let voices = [];

        function populateVoiceList() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        populateVoiceList();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoiceList;
        }

        function speakText() {
            if (synth.speaking) {
                synth.cancel();
            }
            if (textInput.value !== '') {
                const utterThis = new SpeechSynthesisUtterance(textInput.value);
                const selectedOption = voiceSelect.selectedOptions[0].value;
                utterThis.voice = voices[selectedOption];
                
                utterThis.onerror = (event) => {
                    alert('خطأ في قراءة النص');
                };
                
                synth.speak(utterThis);
            }
        }
    </script>

</body>
</html>
